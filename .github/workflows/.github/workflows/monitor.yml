name: API Performance Monitor

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'

    - name: Install Newman
      run: npm install -g newman

    - name: Run Monitor Request
      run: |
        newman run -e ReqRes_Environment.json --inline-scripts --collection '{
          "info": {
            "name": "Monitor Collection",
            "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
          },
          "item": [
            {
              "name": "GET Users Page 1",
              "event": [
                {
                  "listen": "test",
                  "script": {
                    "exec": [
                      "pm.test(\"Status code is 200\", function () { pm.response.to.have.status(200); });",
                      "pm.test(\"Response time is less than 800ms\", function () { pm.expect(pm.response.responseTime).to.be.below(800); });"
                    ]
                  }
                }
              ],
              "request": {
                "method": "GET",
                "url": "https://reqres.in/api/users?page=1"
              }
            }
          ]
        }'
